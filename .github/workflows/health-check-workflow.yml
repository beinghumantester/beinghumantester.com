name: Health Check Scan

# Runs AFTER the site's real deploy finishes, not on the same push event -
# this is what confirms the scan checks what's actually live, not code
# that's still mid-deploy. Matches "Deploy to GitHub Pages" exactly as
# declared in deploy.yml's own `name:` field - GitHub's workflow_run
# trigger matches on this name, not the filename, so this string has to
# be exact or the trigger silently never fires.
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types:
      - completed

jobs:
  health-scan:
    # Only scan if the deploy actually succeeded - no point scanning
    # after a failed deploy, since the live site wouldn't have changed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Explicitly narrowed, not the repo/org default: this workflow can
    # read the repo and open Issues, nothing else. Uses the automatic,
    # ephemeral GITHUB_TOKEN GitHub already provides per-run - not a
    # new secret to create or manage, and it expires when the job ends.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout automation framework
        uses: actions/checkout@v4
        with:
          # Public repo, so no token needed for this checkout.
          repository: beinghumantester/portoflio_website_automation
          path: automation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: automation
        run: pip install -r requirements.txt

      - name: Wait for deploy to fully propagate
        # GitHub Pages deploys can take a short moment to actually serve
        # the new content after the deploy job itself reports success.
        run: sleep 30

      - name: Run health and quality checks
        working-directory: automation
        env:
          BASE_URL: https://beinghumantester.com
          HEADLESS: "true"
        run: pytest tests/test_health_and_quality.py -v

      - name: Restore previous scan for comparison
        # Uses a rotating-key pattern: each run saves under a unique key
        # (below), but restores the MOST RECENT one matching the prefix.
        # No new credentials needed - this is the repo's own built-in
        # cache, not a cross-repo write, which is why this avoids the
        # token/exposure questions raised earlier for other approaches.
        uses: actions/cache/restore@v4
        with:
          path: previous_scan.json
          key: health-scan-baseline-${{ github.run_id }}
          restore-keys: |
            health-scan-baseline-

      - name: Compare against previous scan
        id: diff
        working-directory: automation
        run: |
          python3 scripts/diff_scan.py ../previous_scan.json reports/health_scan.json

      - name: Open GitHub Issue for new findings
        # Only runs when the diff step found something genuinely new -
        # a clean or unchanged result produces no Issue at all, which is
        # the whole point: most runs should be quiet, not noisy.
        if: steps.diff.outputs.has_new_findings == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = JSON.parse(
              fs.readFileSync('automation/scan_diff.json', 'utf8')
            );

            let body = '## New findings from the automated health scan\n\n';
            body += `Triggered by [this run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\n`;

            if (diff.new_accessibility.length > 0) {
              body += '### New accessibility violations\n';
              for (const [page, id] of diff.new_accessibility) {
                body += `- **${id}** on \`${page}\`\n`;
              }
              body += '\n';
            }

            if (diff.new_broken_links.length > 0) {
              body += '### New broken links\n';
              for (const url of diff.new_broken_links) {
                body += `- ${url}\n`;
              }
              body += '\n';
            }

            body += '---\n';
            body += 'Not auto-fixed. Bring this to a review session, ';
            body += 'confirm the root cause, and propose a fix manually ';
            body += 'before any code changes here.';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Health scan: new findings (run ${context.runId})`,
              body: body,
              labels: ['health-scan'],
            });

      - name: Update baseline with this run's scan
        # Without this, the cache would keep saving the OLD baseline
        # forever - the comparison would run correctly each time, but
        # always against the same stale snapshot, since nothing else
        # here ever advances what "previous" actually points to.
        run: cp automation/reports/health_scan.json previous_scan.json

      - name: Save this scan as the new baseline
        uses: actions/cache/save@v4
        with:
          path: previous_scan.json
          key: health-scan-baseline-${{ github.run_id }}

      - name: Upload scan results
        # Runs even if the tests above failed (e.g. a real violation was
        # found) - the whole point is to capture the report either way.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-scan-results
          path: automation/reports/health_scan.json